# Manual companion to `.github/workflows/ci.yml`.
#
# ci.yml is the pipeline: six jobs, the same set `.gitlab-ci.yml` runs, with its own
# `deploy-pages` job. This file existed alongside it as a second path to the same
# Cloudflare Pages project, with a `deploy` job gated on nothing but
# `github.ref == 'refs/heads/main'` — so the two files together meant one push could
# upload to dutaintegra.my twice. That is the shape of the "six production uploads in
# twelve hours" that AGENTS.md records as a mystery, and it is why the gate lives in
# front of the deploy rather than beside it.
#
# It stayed harmless by accident, not by design: its verify job ran
# `npm --prefix web-new run test:web` and `run lint:web`, and those names only exist
# at the repository root (`web-new/` defines `test` and `lint`). The job died on the
# first frontend step, `deploy` had `needs: verify`, and nothing ever shipped. Both
# are fixed below, because a gate that passes by crashing is not a gate.
#
# Deploy remains opt-in through CF_PAGES_DEPLOY_ENABLED. This workflow is
# manual-only: workflow_dispatch runs a deliberate, auditable one-off deploy of
# the selected ref; ci.yml is the sole automatic deployment path on main.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify (tests + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-new/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      - name: Test uptime automation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s automations/uptime-watch -p 'test_*.py' -v

      - name: Validate .env.example
        run: npm run validate:env

      - name: Scan working tree for live secrets
        run: node scripts/scan-secrets.mjs --verify

      - name: Scan full git history for live secrets
        run: node scripts/scan-secrets.mjs --history --verify

      - name: Install frontend dependencies
        run: npm --prefix web-new ci

      - name: Run frontend tests
        run: npm --prefix web-new run test

      - name: Lint frontend
        run: npm --prefix web-new run lint

      - name: Build web
        run: npm run build:web

      # Fails the job if either deploy tree no longer matches web-new/ source, so what
      # gets uploaded is what the tests just ran against. Porcelain rather than
      # `git diff`: a newly emitted hashed bundle has to count as drift too.
      - name: Fail if either deploy tree is stale
        run: |
          if [ -n "$(git status --porcelain -- Web/ public/)" ]; then
            echo "::error::Web/ or public/ is out of date with web-new/ source."
            echo "Run 'npm run build:web' and commit the result."
            git status --porcelain -- Web/ public/
            exit 1
          fi
          echo "Both deploy trees match a fresh build of web-new/."

      - name: Upload the verified public/ tree
        uses: actions/upload-artifact@v4
        with:
          name: pages-deploy-public
          path: public
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && vars.CF_PAGES_DEPLOY_ENABLED == 'true'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: production
      url: https://dutaintegra.my
    steps:
      # Checkout supplies scripts/verify-deploy.mjs. The artifact is downloaded
      # afterwards and replaces public/, so the uploaded bytes remain the bytes
      # the verify job tested rather than a second, unverified build.
      - name: Checkout the verify script
        uses: actions/checkout@v4

      - name: Download the verified artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-deploy-public
          path: public

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install -g wrangler

      # Event fields go through env, never inline into the shell line. The
      # explicit production branch avoids wrangler's detached-HEAD preview
      # fallback, and the explicit hash records the dispatched commit rather
      # than the runner's own CF_PAGES_COMMIT_SHA as the Pages Source.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: wrangler pages deploy public --project-name=dutaintegra --branch main --commit-hash "$COMMIT_SHA" --commit-message "GitHub Actions $RUN_URL"

      # Wrangler returning 0 does not prove the custom domain changed. This
      # fails unless production serves the exact bundle from the artifact.
      - name: Verify production serves this build
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/verify-deploy.mjs
