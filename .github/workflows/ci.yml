name: CI

# The same gate as `.gitlab-ci.yml`, kept in step with it on purpose — change a
# check in one file and change it in the other, or whichever account recovers
# starts enforcing a different set of rules. As of 2026-11-04 nothing here has
# executed: every job for this account ends `failed` with `runner_name: ""` and
# the annotation "your account is locked due to a billing issue", so GitLab is
# the pipeline that actually runs. Treat this file as the standby.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: npm test

      - name: Test uptime automation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s automations/uptime-watch -p 'test_*.py' -v

  # .env.example is the contract for every variable the server reads; a name used in
  # code but undocumented (or documented but gone) fails here rather than on a cold
  # start. Cheap enough to be its own job, and it needs no install.
  env-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate .env.example against the code
        run: node scripts/validate-env.mjs

  # web-new is where the frontend actually lives. Without this job its TypeScript
  # errors go unnoticed, which is how 70 of them accumulated.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-new/package-lock.json

      - name: Install dependencies
        working-directory: web-new
        run: npm ci

      - name: Unit tests
        working-directory: web-new
        run: npm test

      - name: Lint
        working-directory: web-new
        run: npm run lint

      - name: Typecheck and build
        working-directory: web-new
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-new-dist
          path: web-new/dist
          retention-days: 7

  # Warnings never fail the build; only a credential the provider confirms as
  # live does. The gate is deliberately narrow so a red X here always means a
  # real, working secret is exposed — not a docs example or a test fixture.
  #
  # History is scanned too: a secret that was committed and later deleted is
  # still recoverable by anyone with a clone. fetch-depth: 0 is required for it.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scan working tree
        run: node scripts/scan-secrets.mjs --verify

      - name: Scan git history
        run: node scripts/scan-secrets.mjs --history --verify

  # Guards against the failure mode this repo already hit: a bundle committed to a
  # deploy tree that no longer matches web-new/ source. Rebuild and diff.
  #
  # Both trees are checked, not just Web/. Vercel serves Web/ and Cloudflare Pages
  # serves public/, and `npm run build:web` writes the pair through
  # scripts/sync-web.mjs in one pass — a half-synced pair ships the old app to one
  # of them, which is what this job used to miss.
  artifact-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-new/package-lock.json

      - name: Rebuild deploy artifact
        run: npm run build:web

      - name: Fail if either deploy tree is stale
        run: |
          # Porcelain (not `git diff`) so newly emitted hashed bundles count too.
          if [ -n "$(git status --porcelain -- Web/ public/)" ]; then
            echo "::error::Web/ or public/ is out of date with web-new/ source."
            echo "Run 'npm run build:web' and commit the result."
            git status --porcelain -- Web/ public/
            exit 1
          fi
          echo "Both deploy trees match a fresh build of web-new/."

      - name: Upload the verified public/ tree
        uses: actions/upload-artifact@v4
        with:
          name: pages-public
          path: public
          retention-days: 7

  # Uploads exactly the public/ tree the drift job just rebuilt and verified, so the
  # bytes that get shipped are the bytes that got checked — the deploy no longer
  # pays for a second, unverified build of its own.
  #
  # Auto-deploys on main: a green run means the site is live, with no human step.
  # The deploy step is skipped (not failed) when CLOUDFLARE_API_TOKEN is absent, so
  # a repository without the secret still has a green run. The step-level `if` uses
  # the env context, which is the one place a secret's presence can be tested —
  # `secrets` is not available to `if` at the job level.
  deploy-pages:
    needs: [test, frontend, artifact-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: production
      url: https://dutaintegra.my
    steps:
      # Checkout is only for scripts/verify-deploy.mjs; the bytes that ship come
      # from the artifact below, which is downloaded after and overwrites public/.
      - name: Checkout the verify script
        uses: actions/checkout@v7

      - name: Download the artifact-drift output
        uses: actions/download-artifact@v4
        with:
          name: pages-public
          path: public

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler

      # --commit-hash is why this can be trusted as provenance: a bare
      # `wrangler pages deploy` records the deploying runner's CF_PAGES_COMMIT_SHA
      # as the Pages "Source", which says something about the machine, not the
      # commit. Event fields go through env, never inline into the shell line.
      #
      # --branch main is load-bearing. GitHub Actions checks out a detached HEAD,
      # so wrangler cannot infer the branch from git and falls back to "head",
      # which Cloudflare treats as a preview. Without it the upload lands on
      # head.dutaintegra.pages.dev and the custom domain keeps serving the
      # previous bundle, so a "successful" deploy ships nothing.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: wrangler pages deploy public --project-name=dutaintegra --branch main --commit-hash "$COMMIT_SHA" --commit-message "GitHub Actions $RUN_URL"

      # A green deploy step only proves wrangler returned 0, not that the site
      # changed — a preview upload leaves the custom domain on the old bundle.
      # This fails the run unless production serves the bundle just uploaded.
      - name: Verify production serves this build
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/verify-deploy.mjs
